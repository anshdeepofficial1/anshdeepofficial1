name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/fetch_contributions.py
      - scripts/render_heatmap_svg.py
      - .github/workflows/update-profile-art.yml

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    env:
      GITHUB_USERNAME: anshdeepofficial1
      GITHUB_TOKEN: ${{ github.token }}\n      CONTRIBUTION_TOTAL_OFFSET: "198"

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch exact contribution calendar
        run: python scripts/fetch_contributions.py

      - name: Render profile dashboard
        run: python scripts/render_heatmap_svg.py

      - name: Commit refreshed profile art
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contrib-heatmap.svg assets/info-card.svg
          if git diff --cached --quiet; then
            echo "No profile data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile dashboard [skip ci]"
          git push
